      PhilosopherOptions__DurationMinutes: 0.2
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: user
      RabbitMQ__Password: password
      RequestDomains__TableService: http://table-service:8080
    depends_on:
      table-service:
        condition: service_healthy
      rabbitmq:
