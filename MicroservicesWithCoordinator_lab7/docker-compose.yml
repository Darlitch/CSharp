services:
  table-service:
    image: table-service
    build:
      context: .
      dockerfile: TableService.Api/Dockerfile
      args:
        APP_UID: 1000
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      TableOptions__PhilosophersCount: 5
      TableOptions__DisplayUpdateInterval: 20
    healthcheck:
      start_period: 3s
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "status" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      
  coordinator-service:
    image: coordinator-service
    build:
      context: .
      dockerfile: CoordinatorService.Host/Dockerfile
      args:
        APP_UID: 1000
    environment:
      ASPNETCORE_URLS: http://+:8082
      CoordinatorOptions__PhilosopherCount: 5
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: user
      RabbitMQ__Password: password
    depends_on:
      rabbitmq:
        condition: service_healthy
      
  philosopher-plato:
    image: philosopher-plato
    build:
      context: .
      dockerfile: PhilosopherService.Host/Dockerfile
      args:
        APP_UID: 1000
    environment:
      ASPNETCORE_URLS: http://+:8081
      PhilosopherOptions__Name: Платон
      PhilosopherOptions__Id: 1
      PhilosopherOptions__LeftForkId: 1
      PhilosopherOptions__RightForkId: 2
      PhilosopherOptions__DurationMinutes: 0.2
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: user
      RabbitMQ__Password: password
      RequestDomains__TableService: http://table-service:8080
    depends_on:
      table-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        
  philosopher-aristotle:
    image: philosopher-aristotle
    build:
      context: .
      dockerfile: PhilosopherService.Host/Dockerfile
      args:
        APP_UID: 1000
    environment:
      ASPNETCORE_URLS: http://+:8081
      PhilosopherOptions__Name: Аристотель
      PhilosopherOptions__Id: 2
      PhilosopherOptions__LeftForkId: 2
      PhilosopherOptions__RightForkId: 3
      PhilosopherOptions__DurationMinutes: 0.2
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: user
      RabbitMQ__Password: password
      RequestDomains__TableService: http://table-service:8080
    depends_on:
      table-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  philosopher-socrates:
